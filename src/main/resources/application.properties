spring.application.name=spring-prepare
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DB 접속 정보(url/username/password)는 application-local.properties(.gitignore)에 둔다.
# 커밋되는 파일에 active profile을 박아 두는 것은 개발 편의용이다 — 배포 환경이 생기면 실행 인자로 옮긴다 (ANALYSIS §3.6, D-014).
spring.profiles.active=local

# ── Flyway (D-012, M6) ──────────────────────────────────────────────────────
# 마이그레이션 위치는 기본값(classpath:db/migration) 그대로.
# encoding 을 명시한다 — F35 의 교훈을 규칙으로. Boot 의 기본값도 UTF-8 이지만
# (FlywayProperties 소스로 확인 — @SqlConfig 와 달리 플랫폼 기본이 아니다),
# "이 파일들은 UTF-8 이다" 를 설정에 적어 두는 값이 있고 기본값이 바뀌어도 안전하다.
spring.flyway.encoding=UTF-8
# baseline-on-migrate 는 켜지 않는다 (D-012). "Found non-empty schema" 에러는
# 버그가 아니라 재생성하라는 신호다 (M6 계획서 §6 C1).

# ── 인증 (M6) ────────────────────────────────────────────────────────────────
# 세션 만료(시간). 코드가 아니라 프로퍼티인 이유: 값을 바꾸는 데 배포가 필요 없어야 한다.
app.auth.session-hours=24
# BCrypt strength(=cost). 기본 10. 테스트 프로필은 4 로 낮춘다 (M6 계획서 §6 C7) —
# 검증(matches)은 해시 문자열 안의 cost 를 따르므로 strength 가 달라도 서로 검증된다.
app.auth.bcrypt-strength=10
# app.admin-key 는 여기 두지 않는다 — 커밋되는 파일에 비밀 기본값을 두지 않는다 (§3-4).
# application-local.properties 와 application-test.properties 에 각자 넣는다 (M6-check §0).
# 값이 없으면 기동이 실패한다 — 조용히 무인증으로 뜨는 것보다 시끄럽게 죽는 쪽이 안전하다.
