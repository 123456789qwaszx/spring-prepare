spring.application.name=spring-prepare
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DB 접속 정보(url/username/password)는 application-local.properties(.gitignore)에 둔다.
# 커밋되는 파일에 active profile을 박아 두는 것은 개발 편의용이다 — 배포 환경이 생기면 실행 인자로 옮긴다 (ANALYSIS §3.6, M6).
spring.profiles.active=local
