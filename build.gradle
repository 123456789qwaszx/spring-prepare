plugins {
    id 'java'
    // D-001: init 커밋과 PLAN.md 기준인 4.1.1로 복귀. 3.x는 JdbcClient가 없고(3.2 미만) OSS 지원 종료.
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sparta'
version = '0.0.1-SNAPSHOT'
description = 'spring-prepare'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Boot 4.x 스타터 이름: starter-web → starter-webmvc (3.x 강의 자료와 다른 점)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 실습2(메모장 화면) 유지용. 실습3에서는 쓰지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // JdbcClient + HikariCP. JPA는 M9 비교 과제 전까지 넣지 않는다 (PLAN §2.2).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // ── M6 에서 처음 늘어난 의존성 (M6 계획서 §5) ──────────────────────────────
    // Flyway (D-012). Boot 4 에는 spring-boot-starter-flyway 가 **있다** — Boot 3 까지는
    // 없었고 4.0 모듈화 때 생겼다 (boot 레포 v4.1.1 의 starter/spring-boot-starter-flyway 로
    // 확인). 스타터가 자동 구성 모듈(spring-boot-flyway)과 flyway-core 를 함께 끌고 온다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // Flyway 9+ 부터 DB 지원이 모듈로 갈라졌다. MySQL 은 이 모듈이 없으면
    // "Unsupported Database" 로 기동이 실패한다. 버전은 Boot 관리(Flyway 12.4.0).
    runtimeOnly 'org.flywaydb:flyway-mysql'
    // BCrypt 하나 때문에 전체 Security(필터 체인·CSRF·기본 로그인)를 넣지 않는다 —
    // crypto 모듈은 단독으로 동작한다 (M6 계획서 §3-1). 버전은 Boot 관리(Security 7.1.1).
    implementation 'org.springframework.security:spring-security-crypto'

    // 실습1·2 코드(Book, Memo)가 쓴다. 실습3 코드는 record를 써서 Lombok이 필요 없다 (PLAN §2.5).
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Boot 4.x: starter-test → starter-webmvc-test (JUnit5, AssertJ, MockMvc, json-path 포함)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 소스는 UTF-8 이고 한글 리터럴·주석·테스트 메서드명이 있다. JDK 17 javac 는 OS 기본 인코딩(한국어 Windows = MS949)을
// 따르므로 명시하지 않으면 한글이 깨지거나 "unmappable character" 오류가 난다. (JDK 18+ 는 UTF-8 이 기본이지만 toolchain 이 17.)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트 결과를 콘솔에서 바로 보기 위해. 실패 시 스택트레이스 전체를 Claude 에게 붙여 넣기 좋게.
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
